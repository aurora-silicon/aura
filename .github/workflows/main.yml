name: format-check
on:
  push:
    branches: [ main, 'maint/**' ]
  pull_request:
    branches: [ main, 'maint/**' ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install format and build tools
        run: |
          python -m pip install clang-format==20.1.8
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu
          rustup component add rustfmt
      - name: Check formatting
        run: |
          make format-check CLANG_FORMAT=clang-format
          make rustfmt-check
