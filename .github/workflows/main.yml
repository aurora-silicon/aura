name: format-check
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
permissions:
  contents: read
# A newer push to main supersedes the run for the older main head. PR heads, tags and manual
# runs get a group of their own and are never cancelled: the merge train needs CI on the exact
# PR head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  format-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install format and build tools
        run: |
          python -m pip install clang-format==20.1.8
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu
          rustup component add rustfmt
      - name: Check formatting
        run: |
          make format-check CLANG_FORMAT=clang-format
          make rustfmt-check
