name: aurora-agent-policy

# Keeps upstream AI-assistant instruction files out of this repository.
# The policy is .github/aurora/AGENTS.md on the default branch; see
# .github/aurora/agent-policy.sh for the rules.

on:
  push:
  pull_request:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aurora-agent-policy-${{ (github.event_name == 'push' || github.event_name == 'pull_request') && github.ref || 'sweep' }}
  cancel-in-progress: false

env:
  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
  POLICY_BRANCHES: ${{ github.event.repository.default_branch }}

jobs:
  policy:
    if: github.event_name != 'push' || !github.event.deleted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out the policy files only
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github/aurora
          sparse-checkout-cone-mode: false

      - name: Heal the pushed branch
        if: github.event_name == 'push'
        run: bash .github/aurora/agent-policy.sh push "${GITHUB_REF_NAME}"

      - name: Sweep every branch
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: bash .github/aurora/agent-policy.sh sweep

      - name: Check the pull request head
        if: github.event_name == 'pull_request'
        run: bash .github/aurora/agent-policy.sh pr "refs/pull/${{ github.event.pull_request.number }}/head"
