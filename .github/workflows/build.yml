# This is a basic workflow to help you get started with Actions

name: build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the main branch
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install aarch64-linux-gnu- toolchain
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu

      - name: Install aarch64-unknown-none-softfloat rust target
        run: |
          rustup target install aarch64-unknown-none-softfloat

      - name: Build
        run: make -j2 ARCH=aarch64-linux-gnu- CHAINLOADING=1 EXTRA_CFLAGS='-Wstack-usage=2048 -Os'

      - uses: actions/upload-artifact@v7
        with:
          name: aura
          if-no-files-found: error
          path: |
            build/aura.macho
            build/aura.bin

  stage1-clang:
    # Stage 1 has to end below the panel DCP's log buffer (aura-raw.ld). Releases build with
    # gcc. Link both stages with clang too, as a Mac builds them, so that a change that pushes
    # Stage 1 over fails here.
    runs-on: macos-26

    steps:
      - uses: actions/checkout@v7

      - name: Install LLVM, LLD and GNU make
        run: brew install llvm lld make

      - name: Install aarch64-unknown-none-softfloat rust target
        run: rustup target install aarch64-unknown-none-softfloat

      - name: Link Stage 1 and the ESP Stage 2 with clang
        run: |
          gmake -j3 RELEASE=1 CHAINLOADING=1 BUILTIN_LOGO=aurora
          gmake clean
          gmake -j3 RELEASE=1 CHAINLOADING=1 ESP_STAGE2=1 BUILTIN_LOGO=aurora
