name: release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild this v-tag's sources under its tag label (artifacts only, no release)
        required: false
        default: ''
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
    paths:
      - .github/workflows/release.yml
      - tools/package_release.py
permissions:
  contents: read
# A newer push to main supersedes the run for the older main head. PR heads, tags and manual
# runs get a group of their own and are never cancelled: the merge train needs CI on the exact
# PR head.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'main-push' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}

jobs:
  binaries:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.tag && format('refs/tags/{0}', inputs.tag) || '' }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y gcc-aarch64-linux-gnu
          rustup target add aarch64-unknown-none-softfloat
      - name: Select build version
        env:
          REF_TYPE: ${{ inputs.tag && 'tag' || github.ref_type }}
          REF_NAME: ${{ inputs.tag || github.ref_name }}
        run: |
          # A tag names its release: v<VERSION> is labelled VERSION. v<VERSION>.<n> is a
          # maintenance release that keeps VERSION, because the distributions' Stage 2 updaters
          # parse the Stage 1 version as <x.y.z>b<N> with an optional -g<commit>: it is labelled
          # VERSION-g<commit>, as a source build of that commit is. Any other tag is refused.
          sha=${SOURCE_SHA:-$(git rev-parse HEAD)}
          if [ "$REF_TYPE" = tag ]; then
            version=$(cat VERSION)
            name=${REF_NAME#v}
            n=${name#"$version".}
            if [ "$REF_NAME" = "v$version" ]; then
              label=$version
            elif [ "$REF_NAME" = "v$version.$n" ] && [ -n "$n" ] && [ -z "${n//[0-9]/}" ]; then
              label="$version-g${sha:0:8}"
            else
              echo "tag $REF_NAME is neither v$version nor v$version.<n>" >&2
              exit 1
            fi
          else
            label="dev-${sha:0:12}"
          fi
          echo "AURA_VERSION_TAG=$label" >> "$GITHUB_ENV"
      - name: Build and package both stages
        run: |
          for stage in stage1 stage2; do
            esp=0
            if [ "$stage" = stage2 ]; then esp=1; fi
            make clean
            make -j2 ARCH=aarch64-linux-gnu- RELEASE=1 CHAINLOADING=1 ESP_STAGE2="$esp"
            python3 tools/package_release.py --version "$AURA_VERSION_TAG" --variant "$stage" --compiler aarch64-linux-gnu-gcc
          done
          cd dist
          sha256sum --check SHA256SUMS
      - uses: actions/upload-artifact@v7
        with:
          name: aura-release
          path: dist/*
          if-no-files-found: error
  draft:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: aura-release
          path: dist
      - name: Create or update draft assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" --json isDraft > release-state.json 2>/dev/null; then
            jq -e '.isDraft == true' release-state.json
            gh release upload "$RELEASE_TAG" dist/* --clobber
          else
            notes="docs/releases/${RELEASE_TAG#v}.md"
            if [ ! -f "$notes" ]; then
              printf 'Draft release %s. Edit these notes before publishing.\n' "$RELEASE_TAG" > release-notes.txt
              notes=release-notes.txt
            fi
            gh release create "$RELEASE_TAG" dist/* --verify-tag --draft \
              --title "Aura ${RELEASE_TAG#v}" --notes-file "$notes"
          fi
