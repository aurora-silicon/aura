name: test

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Pytest (${{ matrix.os }} + ${{ matrix.compiler }})
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            compiler: gcc
          - os: ubuntu-latest
            compiler: llvm
          - os: macos-26
            compiler: llvm-brew
          - os: macos-15
            compiler: llvm-brew

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - name: Install python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest==9.1.1

      - name: Install arm64 GCC cross-compiler
        if: matrix.compiler == 'gcc'
        run: |
          sudo apt-get update
          sudo apt install gcc-aarch64-linux-gnu

      - name: Install Clang
        if: matrix.compiler == 'llvm'
        run: |
          sudo apt-get update
          sudo apt-get install -y llvm lld

      - name: Install Clang on macOS w/ brew
        if: matrix.compiler == 'llvm-brew'
        run: |
          brew install llvm lld

      - name: Test PMP boot data fixups
        run: sh tests/run-pmp-boot-data.sh

      - name: Run pytest with clang
        if: matrix.os == 'ubuntu-latest' && matrix.compiler == 'llvm'
        env:
          USE_CLANG: '1'
        run: PATH="$(llvm-config --prefix)/bin:$PATH" pytest tests/python tests/test_t8122_gpu_reader.py tests/test_t8122_gpu_resources.py

      - name: Run pytest without clang
        if: matrix.compiler != 'llvm'
        run: pytest tests/python tests/test_t8122_gpu_reader.py tests/test_t8122_gpu_resources.py

      - name: Run T8122 GPU26 powered identity host test
        if: matrix.os == 'ubuntu-latest'
        env:
          CC: ${{ matrix.compiler == 'llvm' && 'clang' || 'gcc' }}
        run: tests/run-t8122-gpu26-identity.sh

  arm64-native:
    name: Pytest (ubuntu-24.04-arm, native start.S)
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.13'

      - name: Install pytest
        run: pip install pytest==9.1.1

      # These run production start.S instructions natively and skip on every other runner
      - name: Run native arm64 tests
        run: |
          set -o pipefail
          pytest -v -rs tests/python/test_start_run_base.py | tee pytest.log
          grep -q "test_start_moves_to_run_base PASSED" pytest.log
