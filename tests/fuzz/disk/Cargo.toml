# Host-only libFuzzer targets for aura's on-disk parsers (rust/src/gpt.rs, apfs.rs, nvme.rs,
# trial.rs, chainload.rs) and the signed-payload check (rust/src/secboot.rs). Not part of the
# firmware build; see run-disk-fuzz.sh.
[package]
name = "aura-disk-fuzz"
version = "0.0.0"
edition = "2021"
license = "MIT AND GPL-2.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[workspace]

[dependencies]
libfuzzer-sys = "0.4"
# the versions and features rust/Cargo.toml builds the firmware with
fatfs = { git = "https://github.com/aurora-silicon/fatfs", rev = "7d505fbfa37a945af5549517f47c1d2e87a8333e", default-features = false, features = ["lfn", "alloc", "explicit-fat32"] }
uuid = { version = "1.23", default-features = false }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
ed25519-compact = { version = "2.1.1", default-features = false, features = ["opt_size"] }

[features]
default = ["sptm_virt_esp"]
chainload = []
sptm_virt_esp = ["chainload"]

[[bin]]
name = "gpt"
path = "fuzz_targets/gpt.rs"
test = false
doc = false
bench = false

[[bin]]
name = "apfs"
path = "fuzz_targets/apfs.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chainload"
path = "fuzz_targets/chainload.rs"
test = false
doc = false
bench = false

[[bin]]
name = "secboot"
path = "fuzz_targets/secboot.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mkseeds"
path = "src/bin/mkseeds.rs"
test = false
doc = false
bench = false
