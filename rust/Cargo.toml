[package]
name = "rust"
version = "0.1.0"
edition = "2021"
repository = "https://github.com/aurora-silicon/aura"
license = "MIT AND GPL-2.0-only"
publish = false

[lib]
crate-type = [ "staticlib" ]

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html
[dependencies]
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
fatfs = { git = "https://github.com/aurora-silicon/fatfs", rev = "7d505fbfa37a945af5549517f47c1d2e87a8333e", default-features = false, features = ["lfn", "alloc", "explicit-fat32"], optional = true }
sha1_smol = { version = "1.0.1" }
ed25519-compact = { version = "2.1.1", default-features = false, features = ["opt_size"] }
uuid = {  version = "1.23", default-features = false, optional = true }
versions = { path = "./versions" }

[features]
chainload = ["dep:fatfs", "dep:uuid"]
# rust_read_into() (the macos= bundle reader) is pulled in only by the SPTM-virt ESP Stage 2;
# keep its fatfs/GPT monomorphisations out of every other Stage 1 (aura-raw.ld size).
sptm_virt_esp = ["chainload"]

# One codegen unit: with the default 16, functions are ordered differently from build to
# build, and the same tree gives a different image.
[profile.release]
codegen-units = 1

# Signature checks run once per boot: size matters more than speed (aura-raw.ld file limit).
[profile.release.package.ed25519-compact]
opt-level = "z"

# So is aura's own Rust: setup code (ADT lookups, GPU init data, the ESP and chainload paths),
# none of it in an exception or I/O path. sha2 keeps the default: it hashes every kernel that
# aura measures.
[profile.release.package.rust]
opt-level = "z"
